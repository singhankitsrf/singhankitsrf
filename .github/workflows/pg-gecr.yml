name: PG-GECR evidence and policy
on:
  push:
    paths: ['projects/pg-gecr/**', '.github/workflows/pg-gecr.yml']
  pull_request:
    paths: ['projects/pg-gecr/**', '.github/workflows/pg-gecr.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python projects/pg-gecr/audit_evidence.py
      - run: python -m unittest discover -s projects/pg-gecr/tests -v
      - run: python projects/pg-gecr/policy.py --input projects/pg-gecr/examples/synthetic_probabilities.json
